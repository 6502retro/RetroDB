# RETRODB.SYSTEM memory layout
#   $1000-$1FFF  variables and buffers (BSS)
#   $2000-       LCODE (file lists, name dialog, overlay loader), then
#                the record window's text (XBSS).  At startup LCODE is
#                put aside in auxiliary memory while the title picture,
#                unpacked from SPLZ, is shown at $2000-$3FFF.
#   $2900-$3FFF  an overlay from RETRODB.OVL (import and export), loaded
#                when needed, over XBSS (which only the record window
#                uses).  RETRODB.OVL holds the three overlays one after
#                another, each padded to $1700 bytes.
#   $4000-       the program, then the packed title picture (SPLZ).
#                Once the picture has been shown, the nesting tables
#                (set up at run time) and the main-memory record pool
#                start where SPLZ was.
MEMORY {
    LOW:  start = $1000, size = $1000, type = rw, file = "";
    LC:   start = $2000, size = $2000, file = %O, fill = yes;
    O0:   start = $2900, size = $1700, file = "build/RETRODB.OVL", fill = yes;
    O1:   start = $2900, size = $1700, file = "build/RETRODB.OVL", fill = yes;
    O2:   start = $2900, size = $1700, file = "build/RETRODB.OVL", fill = yes;
    MAIN: start = $4000, size = $7B00, file = %O;
}
SEGMENTS {
    LCODE:  load = LC, type = rw, define = yes;
    XBSS:   load = LC, type = bss, define = yes;
    OV0:    load = O0, type = rw, define = yes;
    OV0BSS: load = O0, type = bss, define = yes;
    OV1:    load = O1, type = rw, define = yes;
    OV1BSS: load = O1, type = bss, define = yes;
    OV2:    load = O2, type = rw, define = yes;
    OV2BSS: load = O2, type = bss, define = yes;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA:   load = MAIN, type = rw, define = yes;
    SPLZ:   load = MAIN, type = ro, define = yes;
    BSS:    load = LOW, type = bss, define = yes;
}
