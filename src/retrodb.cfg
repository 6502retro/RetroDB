# RETRODB.SYSTEM memory layout
#   $1000-$1FFF  variables and buffers (BSS)
#   $2000-$3FFF  LCODE (the Mouse Calc and file-list code) and more
#                buffers (XBSS).  At startup LCODE is put aside in
#                auxiliary memory while the title picture, unpacked from
#                SPLASHLZ, is shown here.
#   $4000-       the program, then the packed title picture (SPLZ).
#                Once the picture has been shown, the nesting tables
#                (set up at run time) and the main-memory record pool
#                start where SPLZ was.
MEMORY {
    LOW:  start = $1000, size = $1000, type = rw, file = "";
    LC:   start = $2000, size = $2000, file = %O, fill = yes;
    MAIN: start = $4000, size = $7B00, file = %O;
}
SEGMENTS {
    LCODE:  load = LC, type = rw, define = yes;
    XBSS:   load = LC, type = bss, define = yes;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA:   load = MAIN, type = rw, define = yes;
    SPLZ:   load = MAIN, type = ro, define = yes;
    BSS:    load = LOW, type = bss, define = yes;
}
