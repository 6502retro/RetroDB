# MOUSEDB.SYSTEM memory layout
#   $1000-$1FFF  variables and buffers (BSS)
#   $2000-$3FFF  the title picture; afterwards LCODE (the Mouse Calc
#                and file-list code, copied down from its load address)
#                and more buffers (XBSS)
#   $4000-       the program; LCODE's load image after it becomes the
#                main-memory record pool once LCODE has been moved
MEMORY {
    LOW:  start = $1000, size = $1000, type = rw, file = "";
    SPL:  start = $2000, size = $2000, type = rw, file = "";
    MAIN: start = $2000, size = $9B00, file = %O;
}
SEGMENTS {
    SPLASH: load = MAIN, type = ro, start = $2000;
    CODE:   load = MAIN, type = ro, start = $4000;
    RODATA: load = MAIN, type = ro;
    DATA:   load = MAIN, type = rw;
    LCODE:  load = MAIN, run = SPL, type = rw, define = yes;
    XBSS:   load = SPL, type = bss, define = yes;
    BSS:    load = LOW, type = bss, define = yes;
}
